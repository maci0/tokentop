name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt -s (linux only; formatting is platform-independent)
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "needs gofmt -s:"; echo "$unformatted"; exit 1
          fi
      - name: go.mod/go.sum matches source (linux only)
        if: runner.os == 'Linux'
        run: go mod tidy -diff
      # staticcheck resolves build tags per GOOS, so every runner analyzes its
      # own platform-specific files; the linux pass plus the matrix below
      # together cover all of them.
      - name: staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
          go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 -tags sqlite ./agentusage/...
      - name: vet
        run: |
          go vet ./...
          go vet -tags sqlite ./agentusage/...
      - name: govulncheck (linux only; source-level analysis is platform-independent)
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: test
        run: go test -race -shuffle=on ./...
      # The sqlite tag links a database driver in for one agent (opencode), so
      # both halves of that gate have their own tests and both must pass.
      - name: test (sqlite build)
        run: go test -tags sqlite -race -shuffle=on ./agentusage/...

  # The site worker and the screenshot script ship in this repo, so they gate
  # here too: their tests and checks ran nowhere before.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - run: bun test site/

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.6"
      - name: format, lint and type check the screenshot script
        run: make scripts-check

  build:
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: install staticcheck (host binary; GOOS picks the analyzed platform)
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
      - name: vet and staticcheck ${{ matrix.goos }}/${{ matrix.goarch }} (platform-specific files)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go vet ./...
          go vet -tags sqlite ./agentusage/...
          staticcheck ./...
          staticcheck -tags sqlite ./agentusage/...
      - name: compile ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/toktop
      - name: compile ${{ matrix.goos }}/${{ matrix.goarch }} with sqlite
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -tags sqlite -trimpath -o /dev/null ./cmd/toktop

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: vet and staticcheck before shipping (every release platform)
        # Per-platform gate lives in the Makefile; PLATFORMS there is the
        # single source of truth so CI and local checks cannot drift apart.
        run: make vet-cross

      - name: test before shipping
        run: go test -race -shuffle=on ./...

      - name: build all platforms
        id: build
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Platform list, checksum generation and deterministic archive
          # metadata live in the Makefile so local and CI releases cannot
          # drift apart.
          make release VERSION="$VERSION"
          # smoke test the host-platform artifact: proves the binary runs and
          # carries the release version, not the default stamp
          echo "smoke test: toktop_${VERSION}_linux_amd64"
          test "$("./dist/toktop_${VERSION}_linux_amd64" --version)" = "toktop $VERSION"

      - name: generate dependency sbom
        run: make sbom VERSION="${GITHUB_REF_NAME#v}"

      - name: publish github release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

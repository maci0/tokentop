name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: vet before shipping (every release platform)
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos=${target%/*}; goarch=${target#*/}
            echo "vetting $goos/$goarch"
            GOOS="$goos" GOARCH="$goarch" go vet ./...
          done

      - name: test before shipping
        run: go test -race -shuffle=on ./...

      - name: build all platforms
        id: build
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # platform list lives in one place: the Makefile
          make test-dist VERSION="$VERSION"
          (
            cd dist
            sha256sum tokentop_* > checksums.txt
            sha256sum -c checksums.txt
          )
          # smoke test the host-platform artifact: proves the binary runs and
          # carries the release version, not the default stamp
          echo "smoke test: tokentop_${VERSION}_linux_amd64"
          test "$("./dist/tokentop_${VERSION}_linux_amd64" --version)" = "tokentop $VERSION"
          (
            cd dist
            tar czf "tokentop_${VERSION}_checksums.tar.gz" checksums.txt && rm checksums.txt
          )

      - name: generate dependency sbom
        run: make sbom VERSION="${GITHUB_REF_NAME#v}"

      - name: publish github release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

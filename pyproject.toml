# Analyzers for scripts/ (the screenshot renderer). Go analysis lives in
# staticcheck.conf and the Makefile.

[tool.uv]
# Floor matching CI's setup-uv pin (.github/workflows/ci.yml). `make scripts-check`
# also enforces it so an older uv fails with a named message instead of an
# unknown-flag traceback.
required-version = ">=0.12.6"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["scripts"]
required-version = ">=0.16.4"

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "COM812",  # black owns trailing commas
    "RUF105",  # noqa: CODE is the scoped form; ruff: ignore wants names
]

[tool.ruff.lint.per-file-ignores]
# screenshot.py is a CLI renderer: function names are the docs, os.path is
# the I/O style, argv slots and SGR widths are the format, and it prints the
# PNG path. New Python files do not inherit these.
"scripts/screenshot.py" = [
    "D103",
    "PTH",
    "FURB101",  # pathlib read helpers; same I/O style as PTH
    "PLR0914",  # render() is the pixel loop
    "PLR2004",
    "T201",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["scripts"]
warn_unused_configs = true
# Additional checks not covered by strict=.
warn_unreachable = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_unimported = true
local_partial_types = true
strict_bytes = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "typeddict-unknown-key",
    "unimported-reveal",
    "unused-awaitable",
    "unused-ignore",
    "used-before-def",
]
